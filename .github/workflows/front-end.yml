name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-main:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-main:latest
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            kubectl set image deployment/frontend \
              frontend=${{ secrets.DOCKERHUB_USERNAME }}/frontend-main:${{ github.sha }} \
              -n frontend-main
            kubectl rollout status deployment/frontend -n frontend-main --timeout=120s

  deploy-develop:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-develop:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-develop:latest
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            kubectl set image deployment/frontend \
              frontend=${{ secrets.DOCKERHUB_USERNAME }}/frontend-develop:${{ github.sha }} \
              -n frontend-develop
            kubectl rollout status deployment/frontend -n frontend-develop --timeout=120s